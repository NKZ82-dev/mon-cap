<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon Cap</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F3F6FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1130" media="(prefers-color-scheme: dark)">
<script>/* thème choisi dans l’app (auto / clair / sombre), appliqué avant l’affichage pour éviter un éclair */
try{const t=localStorage.getItem("mon-cap-theme");if(t==="light"||t==="dark"){document.documentElement.setAttribute("data-theme",t);document.querySelectorAll("meta[name=theme-color]").forEach(m=>{m.removeAttribute("media");m.content=t==="dark"?"#0D1130":"#F3F6FF";});}}catch(e){}</script>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mon Cap">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F6FF;--ink:#15193D;--soft:#4F5582;--card:#FFFFFF;--hl:#FFD43B;--onhl:#15193D;
  --ok:#1F8A3B;--warn:#B45F00;--n4:#2B8A3E;--n3:#1971C2;--n2:#D9480F;--n1:#C92A2A;--grid:rgba(40,70,190,.07);--line:#15193D;--shc:#15193D;--focus:#1971C2;--dash:rgba(79,85,130,.3);
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1130;--ink:#EEF0FF;--soft:#A7AEDD;--card:#181D4B;--grid:rgba(140,160,255,.06);
  --line:#8F98E8;--shc:#05071A;--focus:#74C0FC;--ok:#51CF66;--warn:#FFB84D;--dash:rgba(167,174,221,.3);--n4:#51CF66;--n3:#74C0FC;--n2:#FFA94D;--n1:#FF6B6B;color-scheme:dark;}}
:root[data-theme="dark"]{--n4:#51CF66;--n3:#74C0FC;--n2:#FFA94D;--n1:#FF6B6B;
  --paper:#0D1130;--ink:#EEF0FF;--soft:#A7AEDD;--card:#181D4B;--grid:rgba(140,160,255,.06);
  --line:#8F98E8;--shc:#05071A;--focus:#74C0FC;--ok:#51CF66;--warn:#FFB84D;--dash:rgba(167,174,221,.3);color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 12px)}
body{margin:0;background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;color:var(--ink);font-family:'Lexend',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:17px;line-height:1.5}
h1,h2,h3{font-family:'Bricolage Grotesque','Lexend',system-ui,sans-serif;font-weight:800;line-height:1.1;margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{max-width:600px;margin:0 auto;padding:18px 16px 170px}
.muted{color:var(--soft)}
.top:empty{display:none}
body.lock{position:fixed;left:0;right:0;overflow:hidden}
.scrim,.sheet{overscroll-behavior:contain}
.dayhead{margin:-4px 0 18px}
.dayhead.r{text-align:right}
.dayhead h1{font-size:1.6rem}
.dayhead p{margin:2px 0 0;color:var(--soft);font-size:.95rem}
.top{margin-bottom:16px}
.top h1{font-size:1.7rem}
.top p{margin:2px 0 0;color:var(--soft);font-size:.95rem}

.seg{display:flex;gap:8px;margin-bottom:18px}
.seg button{flex:1;border:3px solid var(--line);background:var(--card);border-radius:14px;padding:10px 6px;font-weight:600;cursor:pointer;min-height:50px}
.seg button[aria-pressed="true"]{background:var(--hl);color:var(--onhl)}

.hero{background:var(--hl);color:var(--onhl);border:3px solid var(--line);border-radius:22px;box-shadow:4px 4px 0 var(--shc);padding:16px 18px;margin-bottom:22px;cursor:pointer;text-align:left;width:100%;display:block}
.hero small{display:block;font-weight:600;font-size:.85rem;opacity:.8}
.hero b{display:block;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.45rem;line-height:1.15;margin:4px 0 8px}
.hero .chip{background:#fff;color:#15193D;border-color:#15193D}
.hero .chip.co{background:var(--c);color:var(--fg)}

.sec{margin:0 0 26px}
.sec>h2{font-size:1.3rem;margin:0 0 10px}
.empty{border:3px dashed var(--line);border-radius:14px;padding:14px;text-align:center;color:var(--soft)}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.8rem;font-weight:500;padding:1px 9px;border-radius:99px;border:2px solid var(--line);background:var(--card);white-space:nowrap}
.chip.co{background:var(--c);color:var(--fg);border-color:var(--c)}
.chip.star{background:var(--hl);color:var(--onhl);border-color:var(--line)}
.chip.help{border-style:dashed}
.chip.rc{cursor:pointer;font-size:.9rem;padding:5px 12px;min-height:38px;font-family:'Lexend',sans-serif;color:var(--ink)}
.chip.rc:active{background:rgba(127,127,160,.15)}
.src{font-size:.85rem;color:var(--soft)}

/* Horaire */
.slot{display:grid;grid-template-columns:50px 1fr;gap:10px;margin-bottom:8px}
.slot time{font-weight:600;padding-top:12px;font-size:.9rem}
.blk{border:3px solid var(--line);border-left:12px solid var(--c);border-radius:12px;background:var(--card);padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.blk b{font-size:1.05rem}
.slot.now .blk{background:var(--hl);color:var(--onhl)}
.slot.past{opacity:.45}
.slot.lunch .blk{border-style:dashed;border-left-width:3px;background:transparent;padding:6px 12px}
.slot.lunch time{padding-top:8px}

/* Tuiles */
.tile{display:flex;align-items:stretch;background:var(--card);border:3px solid var(--line);border-radius:14px;margin:0 0 10px;overflow:hidden}
.tile .band{width:10px;background:var(--c);flex:none}
.tile .chk,.tile .emo{flex:none;width:56px;display:grid;place-items:center;border:0;border-right:2px dashed var(--dash);background:transparent}
.tile .chk{cursor:pointer}
.tile .emo{font-size:1.35rem}
.box{width:30px;height:30px;border:3px solid var(--line);border-radius:9px;display:grid;place-items:center;font-weight:800;color:#fff;background:var(--card)}
.tile.done .box{background:var(--ok)}
.tile .body{flex:1;min-width:0;text-align:left;background:transparent;border:0;padding:10px 12px;cursor:pointer;min-height:58px;display:flex;flex-direction:column;gap:6px;justify-content:center}
.tile .title{font-weight:600;line-height:1.3}
.tile.done .title{text-decoration:line-through;opacity:.55}
.tile.done .chips{opacity:.6}
.tile .body{position:relative;padding-right:36px}
.hero,.proj{position:relative;padding-right:42px}
.tile .body::after,.proj::after,.hero::after{content:'›';position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:2rem;line-height:1;color:var(--soft);font-weight:600}
.hero::after{color:#15193D}
.hero.hero-s{padding:10px 42px 12px 14px;margin-bottom:14px;border-radius:16px;box-shadow:3px 3px 0 var(--shc)}
.hero.hero-s small{font-size:.75rem}
.hero.hero-s b{font-size:1.1rem;margin:2px 0 6px}
button.proj{display:grid;grid-template-columns:58px minmax(0,1fr) 22px;gap:12px;align-items:center;padding:12px 8px 12px 12px}
button.proj::after{content:none}
.proj .cd{display:grid;justify-items:center;align-content:center;gap:2px;border:3px solid var(--line);border-radius:12px;min-height:60px;background:var(--paper)}
.proj .cd b{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.5rem;line-height:1}
.proj .cd small{font-size:.72rem;color:var(--soft)}
.proj .cd.soon{background:var(--hl);color:var(--onhl)}
.proj .cd.soon small{color:var(--onhl)}
.proj .pc{display:block;min-width:0}
.proj .arr{font-size:2rem;line-height:1;color:var(--soft);font-weight:600;text-align:center}
.proj.done{opacity:.55}
h3.wk{font-size:1.15rem;margin:22px 0 10px}
.ng{margin:16px 0}
.ngh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.ngr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:2px dashed var(--dash)}
.ngr:last-child{border-bottom:0}
.chip.old{background:var(--warn);color:var(--paper);border-color:var(--warn)}
h3.wk span{font-family:'Lexend',sans-serif;font-weight:400;font-size:.85rem}
.ruler{position:relative;height:96px;margin:4px 14px 8px}
.ruler .line{position:absolute;left:0;right:0;bottom:30px;height:4px;background:var(--line);border-radius:2px}
.ruler i{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--c);border:2px solid var(--line);transform:translateX(-50%)}
.ruler .tk{position:absolute;bottom:24px;width:2px;height:16px;background:var(--line);transform:translateX(-50%)}
.ruler .tl{position:absolute;bottom:0;font-size:.72rem;color:var(--soft);transform:translateX(-50%);white-space:nowrap}
.ruler .now{position:absolute;bottom:22px;left:0;width:4px;height:20px;background:var(--hl);border:2px solid var(--line);transform:translateX(-50%)}
.ruler .fin{position:absolute;top:0;right:0;font-size:.78rem;font-weight:600;transform:translateX(30%)}
.tile .body:active,.proj:active{background:rgba(127,127,160,.15)}
.hero:active{filter:brightness(.95)}

.bring{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:4px 14px}
.bring p{margin:0;padding:10px 0;border-bottom:2px dashed var(--dash)}
.bring p:last-child{border-bottom:0}
.bl{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:2px dashed var(--dash);cursor:pointer}
.bl:last-child{border-bottom:0}
.bl.sub{padding-left:28px}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.add{flex:none;border:2px dashed var(--line);background:transparent;color:var(--ink);border-radius:99px;padding:4px 14px;font-family:'Lexend',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;min-height:38px}
.add:active{background:rgba(127,127,160,.15)}
.form{display:grid;gap:12px;margin-top:8px}
.form label{display:grid;gap:4px;font-weight:500;font-size:.9rem}
.form input,.form select,.form textarea{font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:12px;padding:10px 12px;min-height:48px;width:100%}
.form textarea{min-height:76px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{margin-top:10px}
#ptr{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:50%;transform:translate3d(-50%,-50px,0);opacity:0;z-index:50;width:40px;height:40px;border-radius:50%;
  background:var(--card);border:2px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:20px;pointer-events:none;transition:opacity .2s}
#ptr span{display:block;line-height:1}
#ptr.tourne span{animation:ptrK .8s linear infinite}
@keyframes ptrK{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#ptr.tourne span{animation:none}}
.comp{border-left:4px solid var(--line);padding:6px 0 6px 12px;margin:0 0 12px}
button.lien{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;font:inherit;cursor:pointer}
a.lien{color:var(--ink);text-decoration:underline}
.btn.danger{background:var(--card);color:var(--warn);border-color:var(--warn)}
.manual{font-size:.88rem;color:var(--soft);margin:0}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;width:60px;height:60px;border-radius:50%;border:3px solid var(--line);background:var(--hl);color:var(--onhl);font-size:2.1rem;line-height:1;font-weight:600;cursor:pointer;box-shadow:3px 3px 0 var(--shc)}
.fab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shc)}
.toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 16px;font-weight:600;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}
.blr{display:flex;align-items:center;border-bottom:2px dashed var(--dash)}
.blr:last-child{border-bottom:0}
.blr .bl{flex:1;border-bottom:0}
.ed{flex:none;width:44px;height:44px;border:0;background:transparent;font-size:1.9rem;line-height:1;color:var(--soft);cursor:pointer}
.bl input{width:26px;height:26px;flex:none;accent-color:var(--ok);margin:0;cursor:pointer}
.bl .t{display:block;font-weight:500;line-height:1.3}
.bl small{display:block;color:var(--soft);font-size:.85rem;margin-top:2px}
.bl.on .t{text-decoration:line-through;opacity:.55}
.sec>.hint{margin:-6px 0 10px;color:var(--soft);font-size:.9rem}

/* Semaine */
details.day{background:var(--card);border:3px solid var(--line);border-radius:16px;margin-bottom:12px}
details.day.today{outline:4px solid var(--hl)}
details.day.past{opacity:.5}
details.day>summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px}
details.day>summary::-webkit-details-marker{display:none}
.dn b{font-family:'Bricolage Grotesque',sans-serif;font-size:1.2rem}
.dn span{margin-left:6px;font-size:.85rem}
.cnt{display:flex;gap:10px;font-weight:600;font-size:.95rem;align-items:center}
.chev{display:inline-block;transition:transform .2s}
details[open]>summary .chev{transform:rotate(180deg)}
details.day>div{border-top:2px dashed var(--dash);padding:12px 14px 4px}
.mini{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.mini span{font-size:.78rem;border-radius:8px;padding:2px 7px;background:var(--c);color:var(--fg)}

/* Gros projets */
.horizon{display:flex;align-items:center;gap:14px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:14px;margin-bottom:22px}
.horizon .big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:2.4rem;line-height:1}
.proj{background:var(--card);border:3px solid var(--line);border-left:14px solid var(--c);border-radius:16px;padding:14px;margin-bottom:14px;cursor:pointer;text-align:left;width:100%;display:block}
.proj h3{font-size:1.25rem;margin:8px 0 4px}
.proj .chip.when{background:var(--hl);color:var(--onhl)}
.bar{height:12px;border:3px solid var(--line);border-radius:99px;overflow:hidden;background:var(--card);margin:10px 0 0}
.bar i{display:block;height:100%;background:var(--ok)}

/* Notes */
.grade{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:3px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.grade .big{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.6rem;text-align:right}
.grade svg{height:30px}.grade .spk{height:30px}
.grade svg{width:100%;height:36px}
.trend{font-size:.85rem;font-weight:600;text-align:right}
.trend.up{color:var(--ok)}.trend.down{color:var(--warn)}
.card{background:var(--card);border:3px solid var(--line);border-radius:14px;padding:14px}
details.fold{border:3px solid var(--line);border-radius:14px;background:var(--card);padding:0 14px;margin:10px 0}
details.fold>summary{cursor:pointer;padding:12px 0;font-weight:600;min-height:48px;list-style:none}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'▾';float:right;transition:transform .2s}
details.fold[open]>summary::after{transform:rotate(180deg)}
details.fold>div{padding-bottom:12px}

/* Navigation et fiche */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);border-top:3px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:600px;margin:0 auto;display:flex;gap:6px}
.tabs button{flex:1;display:grid;justify-items:center;border:3px solid var(--line);background:var(--card);border-radius:14px;padding:4px 2px;font-weight:600;font-size:.78rem;line-height:1.2;cursor:pointer;min-height:56px}
.tabs button span{font-size:1.3rem;line-height:1.25}
.tabs button[aria-current="page"]{background:var(--hl);color:var(--onhl)}
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,40,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:600px;max-height:88vh;overflow-y:auto;border:3px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:18px 18px calc(26px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.5}to{transform:none;opacity:1}}
.sheet h2{font-size:1.5rem;margin:10px 0}
.sheet .x{float:right;position:sticky;top:0;z-index:3;width:44px;height:44px;border-radius:50%;border:3px solid var(--line);background:var(--card);font-size:1.1rem;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.sheet p{margin:8px 0}
.sheet h3{font-size:1.05rem;margin:16px 0 4px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:2px dashed var(--dash);cursor:pointer}
.step:last-child{border-bottom:0}
.step input{flex:none;width:26px;height:26px;accent-color:var(--ok);margin:0;cursor:pointer}
.btn{display:flex;width:100%;align-items:center;justify-content:center;border:3px solid var(--line);background:var(--hl);color:var(--onhl);border-radius:14px;padding:12px;font-weight:600;cursor:pointer;min-height:52px;margin-top:16px}
.btn.plain{background:var(--card);color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* ===== Allègement visuel ===== */
:root{--sel-bg:#15193D;--sel-fg:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sel-bg:#EEF0FF;--sel-fg:#0D1130}}
:root[data-theme="dark"]{--sel-bg:#EEF0FF;--sel-fg:#0D1130}
/* 1. Contours seulement sur ce qui se touche */
.blk{border:0;border-left:8px solid var(--c);padding:8px 12px}
.bring,.card,.horizon{border:0}
.grade{border:2px solid var(--line)}
.empty{border:0;background:var(--card);border-radius:14px}
.tile,.proj,details.day,.seg button,.hero{border-width:2px}
.proj{border-left-width:12px}
details.day.today{outline:3px solid var(--hl)}
/* 2. Jaune réservé à « maintenant » et aux évaluations */
.seg button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-fg)}
/* 4. Horaire compact */
.slot{margin-bottom:6px}
.slot time{padding-top:8px}
.blk b{font-size:1rem}
.slot.now .blk{box-shadow:none}
.slot.lunch .blk{border:0;background:transparent;padding:2px 12px;color:var(--soft)}
.slot.lunch time{padding-top:4px;color:var(--soft)}
/* 5. Barre du bas plus basse, + au centre */
.tabs{border-top-width:2px;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{gap:4px;align-items:center}
.tabs button{border:0;background:transparent;min-height:52px;font-size:.72rem;padding:4px 2px}
.tabs button span{font-size:1.2rem}
.tabs button[aria-current="page"]{background:var(--sel-bg);color:var(--sel-fg)}
.tabs button.plus{flex:0 0 54px;width:54px;height:54px;min-height:54px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:2rem;line-height:1;display:grid;place-items:center;padding:0}
#app{padding-bottom:110px}
.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
/* Barre du bas : espacement régulier, + centré */
.tabs{padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 64px repeat(2,minmax(0,1fr));gap:6px;align-items:center}
.tabs button{width:100%;white-space:nowrap;font-size:clamp(.62rem,2.8vw,.76rem)}
.tabs button.plus{justify-self:center;width:54px;height:54px;flex:none}
.tabs button.plus svg{display:block}
/* Formulaire d’ajout en plein écran */
.scrim.full{background:var(--paper);align-items:stretch}
.sheet.full{max-width:600px;height:100%;max-height:none;border:0;border-radius:0;padding:calc(16px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px));animation:none}
.sheet.full h2{margin-top:6px}
/* ===== Finitions : alignements et contrôles ===== */

<div id="app">
  <header class="top" id="top"></header>
  <main id="view"></main>

<nav class="tabs" aria-label="Navigation principale"><div id="tabs"></div></nav>

<script>
(function(){
'use strict';
function $(s){return document.querySelector(s);}

/* ===== Données : uniquement Pednet et Classroom (relevées le 14 oct. 2026) ===== */
/* ===== Données : rien n'est écrit dans ce fichier. Tout est chargé depuis le téléphone. ===== */
/* Mon Cap — convertit une collecte brute de l'extension vers les données de l'app.
   Utilisable dans le navigateur (app) et dans l'extension. Aucune donnée personnelle ici :
   le lien prof → matière vient du profil. */
/* Emoji d'une activité d'après son nom (et le texte qui l'annonce). L'ordre compte :
   « tennis de table » avant « tennis », « football américain » avant « football ». 🏅 par défaut. */
const EMOJIS_ACTIVITE=[
  [/basket/,'🏀'],[/football am[ée]ricain|flag.?football/,'🏈'],[/soccer|football|futsal/,'⚽'],[/hockey/,'🏒'],
  [/volley/,'🏐'],[/badminton/,'🏸'],[/tennis de table|ping.?pong/,'🏓'],[/tennis/,'🎾'],[/natation|nage|piscine|aquati/,'🏊'],
  [/athl[ée]tisme|cross|course [aà] pied|\bcourse\b|marathon|\brun/,'🏃'],[/planche [aà] neige|snowboard/,'🏂'],[/\bski\b|ski alpin|ski de fond/,'⛷️'],
  [/patin/,'⛸️'],[/gymnasti|trampoline/,'🤸'],[/escalade|grimpe/,'🧗'],[/judo|karat[ée]|taekwondo|arts? martia|jiu/,'🥋'],[/boxe/,'🥊'],
  [/v[ée]lo|cyclisme|vtt/,'🚴'],[/baseball|softball/,'⚾'],[/rugby/,'🏉'],[/golf/,'⛳'],[/ultimate|frisbee/,'🥏'],[/cheer/,'📣'],
  [/danse/,'💃'],[/chorale|\bchant\b|vocal/,'🎤'],[/musique|harmonie|orchestre|band|guitare|piano|violon/,'🎵'],
  [/th[ée][aâ]tre|impro/,'🎭'],[/[ée]checs/,'♟️'],[/robot/,'🤖'],[/science|g[ée]nie/,'🔬'],[/arts? plastique|dessin|peinture|\bart\b/,'🎨'],
  [/d[ée]bat|[ée]loquence/,'🗣️'],[/jeux? vid[ée]o|e.?sport/,'🎮'],[/plein air|camping/,'🏕️'],[/lecture|livre|biblioth/,'📚']];
function emojiActivite(...textes){
  const t=textes.join(' ').toLowerCase().normalize('NFC');
  for(const [re,e] of EMOJIS_ACTIVITE) if(re.test(t)) return e;
  return '🏅';
}

/* Profil construit à partir de la collecte : profs et locaux (Horaire), récups (consignes Classroom),
   activités hebdomadaires (CapNet). Aucune saisie à la main. */
function construireProfil(col){
  const coba=col.coba||{}, cr=col.classroom||{}, hor=coba.horaire||{}, P={type:'mon-cap-profil',version:2,profs:{},activites:[],cycle:null};
  const C3=c=>(c||'').slice(0,3).toUpperCase();
  // noms complets connus par le Suivi : « Tremblay Roy, Marie »
  const complets=[...new Set(((coba.suivi||{}).entrees||[]).map(e=>e.enseignant).filter(Boolean))];
  const nomComplet=abr=>{
    const [nom,ini]=abr.split(',').map(x=>(x||'').trim());
    const racine=(nom||'').split(/[-\s]/)[0].toLowerCase();
    const t=complets.find(c=>c.split(',')[0].toLowerCase().startsWith(racine)&&(!ini||(c.split(',')[1]||'').trim().toLowerCase().startsWith(ini.replace(/\./g,'').slice(0,1).toLowerCase())));
    if(t){const [n,p]=t.split(',').map(x=>x.trim());return p?p+' '+n:n;}
    return ini?ini+' '+nom:nom;   // forme abrégée de l'Horaire, telle quelle
  };
  const parCours={};
  for(const k of hor.cases||[]){const c=C3(k.cours);(parCours[c]=parCours[c]||{profs:{},locaux:{}});
    parCours[c].profs[k.prof]=(parCours[c].profs[k.prof]||0)+1; parCours[c].locaux[k.local]=(parCours[c].locaux[k.local]||0)+1;}
  const parFreq=o=>Object.keys(o).sort((a,b)=>o[b]-o[a]);
  for(const [c,v] of Object.entries(parCours)) P.profs[c]={p:nomComplet(parFreq(v.profs)[0]),loc:parFreq(v.locaux).join(' ou ')};
  // récups annoncées dans une consigne Classroom : on garde la phrase exacte du prof
  const CRC=nom=>{const n=(nom||'').toLowerCase();if(/math/.test(n))return'MAT';if(/fran/.test(n))return'FRA';if(/english|angl/.test(n))return'ANG';
    if(/hist/.test(n))return'HIS';if(/g[ée]o/.test(n))return'GEO';if(/scien/.test(n))return'SCT';if(/ate|cr[ée]atic/.test(n))return'ATE';return null;};
  for(const p of cr.publications||[]) for(const e of p.elements||[]){
    const code=CRC(p.cours); if(!code||!P.profs[code]||P.profs[code].rec)continue;
    const phrase=(e.detail||'').split(/\n|(?<=[.!?])\s+/).find(x=>/r[ée]cup[ée]ration/i.test(x)&&/\d{1,2}\s*h\s*\d{2}/.test(x));
    if(phrase){P.profs[code].rec=phrase.trim().replace(/[`´]+$/,'');P.profs[code].src='C';}
  }
  // Activités : CapNet donne l'inscription et la période ; l'horaire vient d'un courriel
  // (« Jours : Mardi et jeudi, de 15 h à 16 h 30 », « Lieu : … »). On les associe par un mot-clé commun.
  const JOURS={dimanche:0,lundi:1,mardi:2,mercredi:3,jeudi:4,vendredi:5,samedi:6};
  const auj=(col.collecte_le||'').slice(0,10);
  const sansAc=x=>(x||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'');
  const motsCles=t=>sansAc(t).split(/[^a-z0-9]+/).filter(w=>w.length>=5&&!['groupe','activite','activites','saison','reservistes'].includes(w));
  const horaires=[];
  for(const m of coba.courriels||[]){
    const tx=m.texte||''; const lj=tx.match(/Jours?\s*:\s*([^\n]+)/i); if(!lj)continue;
    const jours=Object.entries(JOURS).filter(([n])=>new RegExp(n,'i').test(lj[1])).map(([,v])=>v); if(!jours.length)continue;
    const hh=lj[1].match(/de\s+(\d{1,2})\s*h\s*(\d{2})?\s*à\s*(\d{1,2})\s*h\s*(\d{2})?/i)||[];
    const lieu=(tx.match(/Lieu\s*:\s*([^\n]+)/i)||[])[1];
    horaires.push({objet:m.objet||'',texte:tx,jours,hh,lieu:lieu&&lieu.trim(),de:m.expediteur||''});
  }
  const inscrites=(Array.isArray(coba.activites)?coba.activites:[]).filter(a=>(!a.statut||/inscrit/i.test(a.statut))&&(!a.fin||a.fin>=auj));
  for(const h of horaires){
    const mh=new Set([...motsCles(h.objet),...motsCles(h.texte.slice(0,300))]);
    // « basketball » ↔ « Lions Basketball » ; « basket » seul est trop court pour un mot-clé, on teste aussi la racine
    const act=inscrites.find(a=>motsCles(a.titre).some(w=>mh.has(w)||[...mh].some(x=>x.startsWith(w.slice(0,6))||w.startsWith(x.slice(0,6)))));
    const titre=act?(act.titre.split(' - ')[0].trim()):(h.objet||'Activité');
    const d=h.hh;
    P.activites.push({id:'act-'+sansAc(titre).replace(/[^a-z0-9]+/g,'-').slice(0,30),titre,code:'SPO',emoji:emojiActivite(titre,h.objet),jours:h.jours,
      heure:d[1]?(+d[1])+'h'+(d[2]||'00'):'',debut:act?act.debut:null,jusqu_au:act?act.fin:null,
      note:(d[1]?'De '+(+d[1])+'h'+(d[2]||'00')+' à '+(+d[3])+'h'+(d[4]||'00'):'')+(h.lieu?', '+h.lieu:'')+'. Horaire annoncé par courriel'+(h.de?' ('+h.de+')':'')+'.'});
  }
  if(hor.foyer)P.groupe=hor.foyer;
  return P;
}

function convertirCollecte(col, profilExterne){
const coba=col.coba||{}, cr=col.classroom||{};
const profil=construireProfil(col);
// compléter avec un profil importé à la main (ancien format), sans écraser ce qui vient de la collecte
if(profilExterne){for(const [c,v] of Object.entries(profilExterne.profs||{}))if(!profil.profs[c])profil.profs[c]=v;
  if(!profil.activites.length&&profilExterne.activites)profil.activites=profilExterne.activites;
  if(profilExterne.cycle)profil.cycle=profilExterne.cycle;}
// nom de famille du prof -> code de matière, tiré du profil (ex. « Tremblay » -> SCT)
const PROF2CODE={};
for(const [code,p] of Object.entries((profil&&profil.profs)||{})){const n=(p.p||'').trim().split(/\s+/).pop(); if(n&&!PROF2CODE[n])PROF2CODE[n]=code;}

// --- Code de cours à 3 lettres (MAT, FRA…) à partir du code Coba (ex. MAT201) ou du cours Classroom ---
const CODE3=c=>(c||'').slice(0,3).toUpperCase();
const COURS_CONNUS={MAT:1,FRA:1,ANG:1,HIS:1,GEO:1,SCT:1,ATE:1,CCQ:1,DRA:1,EDU:1};
// Classroom : "Mathématique(201)" -> MAT, "ATE groupe A" -> ATE, "English" -> ANG, "Géographie" -> GEO
const CR2CODE=nom=>{const n=(nom||'').toLowerCase();
  if(/math/.test(n))return'MAT'; if(/fran/.test(n))return'FRA'; if(/english|angl/.test(n))return'ANG';
  if(/hist/.test(n))return'HIS'; if(/g[ée]o/.test(n))return'GEO'; if(/scien|sct/.test(n))return'SCT';
  if(/ate|cr[ée]atic|tinker|impression|fablab/.test(n))return'ATE'; if(/cit|ccq/.test(n))return'CCQ';
  if(/dram|th[ée][aâ]/.test(n))return'DRA'; if(/[ée]duc|sport|endurance/.test(n))return'EDU'; return null;};

// --- Normaliser une heure "08:05" -> "8h05" ---
const hh=t=>{const m=(t||'').match(/(\d{1,2}):(\d{2})/);return m?(+m[1])+'h'+m[2]:'';};

// --- AGENDA daté : { "AAAA-MM-JJ": { cycle:5, periodes:[{h:"8h05",code:"MAT"},…] } } ---
const DEBUTS=['08:05','09:30','12:15','13:40','15:05'];
const AGENDA={};
for(const j of coba.agenda||[]){
  // seules les heures de début de période sont des cours ; « 23:59 » est une heure limite de remise
  const per=(j.cours||[]).filter(c=>DEBUTS.includes(c.heure)).map(c=>({s:c.heure,code:CODE3(c.cours)})).sort((a,b)=>a.s.localeCompare(b.s));
  AGENDA[j.date]={cycle:j.jour_cycle||null,periodes:per};
}
// Jours de semaine sans aucun cours dans l'agenda (congés, journées pédagogiques), sur la période couverte
const CONGES={};
{ const dates=Object.keys(AGENDA).sort(); if(dates.length){ const d=new Date(dates[0]+'T12:00'), fin=new Date(dates[dates.length-1]+'T12:00');
  for(;d<=fin;d.setDate(d.getDate()+1)){ const w=d.getDay(), k=d.toISOString().slice(0,10);
    if(w>0&&w<6&&(!AGENDA[k]||!AGENDA[k].periodes.length)) CONGES[k]='Aucun cours à l’agenda'; } } }

// --- TRAVAUX / ÉVALUATIONS depuis Coba ---
const TYPE=(cat,trav)=>{const t=((cat||'')+' '+(trav||'')).toLowerCase();
  if(/examen|exam\b|test\b/.test(t))return'exam';
  if(/\bsae\b/.test(t))return'sae';
  if(/projet|recherche|bd\b|pr[ée]sentation/.test(t))return'projet';
  if(/dict[ée]e/.test(t))return'test';
  return'devoir';};
const slug=s=>(s||'').toLowerCase().normalize('NFKD').replace(/[^\w]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
const auj=col.collecte_le.slice(0,10);
const ITEMS=[];
for(const t of coba.travaux||[]){
  if(t.date_completee)continue;                  // déjà remis
  if((t.resultat_brut||'').trim())continue;       // déjà noté -> ira dans NOTES
  const code=CODE3(t.cours);
  if(!t.date_due)continue;
  const o={src:'P'};
  if(t.heure_due)o.time=hh(t.heure_due);
  if(t.description)o.note=t.description;
  ITEMS.push({id:slug(code+'-'+t.travail),d:t.date_due,c:code,t:t.travail,ty:TYPE(t.categorie,t.travail),...o});
}

// --- Heure affichée : la période de cours où l'agenda place le travail ; « 23h59 » n'est qu'une heure limite ---
const cleT=t=>(t||'').toLowerCase().replace(/\s+/g,'');
const PERIODE={};
for(const j of coba.agenda||[]) for(const c of j.cours||[]) for(const titre of c.travaux_lies||[]) PERIODE[j.date+'|'+cleT(titre)]=c.heure;
for(const it of ITEMS){
  const p=PERIODE[it.d+'|'+cleT(it.t)];
  if(p&&DEBUTS.includes(p)) it.time=hh(p);
  else if(it.time==='23h59') delete it.time;
}

// --- Travaux annoncés SEULEMENT dans l'agenda (pas encore dans Travaux) ---

const VIDES=new Set(['examen','etude','sections','section','etape','partie','travail','devoir','document','plan','questions','consignes','sujet']);

const MOIS_EN2={january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12};
const MOIS_FR2={janv:1,févr:2,fevr:2,mars:3,avr:4,mai:5,juin:6,juil:7,août:8,aout:8,sept:9,oct:10,nov:11,déc:12,dec:12};
const ANNONCES=[];

// Le cours d'une annonce : celui de son AUTEUR quand c'est sans ambiguïté (un résumé mal découpé ne peut

const normNom=x=>(x||'').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z]+/g,' ').trim();

const codeAnnonce=a=>{const lu=CR2CODE(a.cours),cand=coursDeLAuteur(a.auteur);

      RECUPS.push({id:slug('rec-'+code+'-'+f.date+'-'+heureTexte(f.heure_ou_periode||f.citation)),d:f.date,ty:'recup',c:code,t:'Récupération',time:heureTexte(f.heure_ou_periode||f.citation),

{const vus=new Set();for(let i=ANNONCES.length-1;i>=0;i--){if(vus.has(ANNONCES[i].id))ANNONCES.splice(i,1);else vus.add(ANNONCES[i].id);}}

// --- ÉVALUATIONS ANNONCÉES SUR CLASSROOM (texte des travaux et du matériel, annonces, faits de l'IA) ---
// Une phrase qui parle d'une évaluation ET donne une date en clair. Croisée avec Coba (même matière, à 3 jours près) :
// - déjà dans Coba : la fiche s'enrichit du texte du prof (« Sur Classroom ») ;
// - absente de Coba : l'évaluation est ajoutée, avec la mention « Annoncé sur Classroom ».
const RE_EVAL=/\b(test|examen|exam|quiz|[ée]valuation|dict[ée]e|contr[ôo]le|sae)\b/i;
const RE_DATE_FR=/\b(\d{1,2})(?:er)?\s+(janv|f[ée]vr|mars|avr|mai|juin|juil|ao[uû]t|sept|oct|nov|d[ée]c)[a-zéû]*\.?/i;
const RE_DATE_EN=/\b(january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{1,2})(?:st|nd|rd|th)?\b/i;
const MOIS_N={janv:1,fevr:2,févr:2,mars:3,avr:4,mai:5,juin:6,juil:7,aout:8,août:8,sept:9,oct:10,nov:11,dec:12,déc:12};
function datesEvaluation(texte,ref){
  const r=(ref||auj).slice(0,10),out=[];
  const an=mo=>{let y=+r.slice(0,4);if(mo<+r.slice(5,7)-6)y++;return y;};
  for(const ligne of (texte||'').split(/\n|(?<=[.!?])\s+/)){
    if(!RE_EVAL.test(ligne))continue;
    let m=ligne.match(RE_DATE_FR),d=null;
    if(m){const mo=MOIS_N[m[2].toLowerCase().replace('é','e').replace('û','u').slice(0,4)]||MOIS_N[m[2].toLowerCase().slice(0,4)]||MOIS_N[m[2].toLowerCase().slice(0,3)];if(mo)d=an(mo)+'-'+String(mo).padStart(2,'0')+'-'+m[1].padStart(2,'0');}
    else if((m=ligne.match(RE_DATE_EN))){const mo=MOIS_EN2[m[1].toLowerCase()];d=an(mo)+'-'+String(mo).padStart(2,'0')+'-'+m[2].padStart(2,'0');}
    if(d)out.push({d,ligne:ligne.trim(),mot:ligne.match(RE_EVAL)[1]});
  }
  return out;
}
const CANDIDATS=[];
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
// 1. texte des travaux et du matériel Classroom
for(const p of cr.publications||[]) for(const e of p.elements||[]){

for(const a of cr.annonces||[]){

 const evalsCoba=ITEMS.filter(i=>/^(exam|sae|test)$/.test(i.ty));

 }}

/* Relais (stockage partagé) : reçu par le lien d'installation …/#relais=<adresse>&cle=<clé téléphone>.
   La partie après # n'est jamais envoyée à GitHub. Sur iPhone, l'app installée a son propre stockage :
   le lien peut aussi être collé dans l'app. */
function lireLienRelais(txt){try{const u=new URL(txt.trim());const q=new URLSearchParams(u.hash.slice(1));
  // forme courte (QR code) : #c=<identifiant du script>.<h + clé en base64url | t + clé en clair>
  const c=q.get('c');
  if(c){const m=c.match(/^([\w-]+)\.([ht])(.+)$/);if(m){let cle=m[3];
    if(m[2]==='h'){let s=cle.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';cle=[...atob(s)].map(x=>x.charCodeAt(0).toString(16).padStart(2,'0')).join('');}
    else cle=decodeURIComponent(cle);
    return{url:'https://script.google.com/macros/s/'+m[1]+'/exec',cle};}}
  const url=q.get('relais'),cle=q.get('cle');if(url&&cle&&/^https:\/\/script\.google\.com\//.test(url))return{url,cle};}catch(e){}return null;}
const SUR_IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const INSTALLEE=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;
function lienDeRelais(r){return location.origin+location.pathname+'#relais='+encodeURIComponent(r.url)+'&cle='+encodeURIComponent(r.cle);}
/* Relier l'appareil à un relais. Un autre relais, c'est un autre foyer : les données, coches et ajouts
   de l'ancien sont oubliés sur cet appareil (ils restent dans le Drive de l'ancien relais). */
function enregistrerLien(r){
  let ancien=null;try{ancien=JSON.parse(localStorage.getItem('mon-cap-relais')||'null');}catch(e){}
  if(!ancien||ancien.url!==r.url||ancien.cle!==r.cle){
    if(ancien&&ancien.url!==r.url){['mon-cap-donnees','mon-cap-v2'].forEach(k=>localStorage.removeItem(k));}
  }
  localStorage.setItem('mon-cap-relais',JSON.stringify(r));
}

const NOW=new Date(),TODAY=ymd(NOW),NOWMIN=NOW.getHours()*60+NOW.getMinutes();
const toMin=t=>{const a=t.split(':').map(Number);return a[0]*60+a[1];};
const hh=t=>{const a=t.split(':');return Number(a[0])+'h'+a[1];};

/* Périodes réelles d’un jour : agenda de Coba si disponible, sinon cycle calculé */
function periodes(d){
  if(AG[d])return AG[d].periodes.map(x=>({s:x.s,e:finDe(x.s),code:x.code}));
  const cd=cycleDayCalc(d);if(!cd)return [];

function cycleDay(s){if(AG[s])return AG[s].cycle||null;return cycleDayCalc(s);}
function cycleDayCalc(s){
  if(!CYC.length||!isSchool(s)||s<CYC_FROM||s>CYC_TO)return null;
  let n=0,cur=REF;
  if(s>=REF){while(cur<s){cur=addDays(cur,1);if(isSchool(cur))n++;}}
  else{while(cur>s){if(isSchool(cur))n--;cur=addDays(cur,-1);}}
  return (((REF_DAY-1+n)%CYC_N)+CYC_N)%CYC_N+1;
}

/* Partage des coches entre téléphones (etat.json) : chaque entrée porte l'heure de sa dernière modification ;
   à la fusion, la plus récente l'emporte, entrée par entrée. « open » (sections dépliées) reste propre au téléphone. */
const CHAMPS_PARTAGES=['done','steps','bag','home'];
function instantane(){const o={};CHAMPS_PARTAGES.forEach(c=>{o[c]=JSON.parse(JSON.stringify(S[c]||{}));});o.custom={};(S.custom||[]).forEach(x=>{o.custom[x.id]=x;});return o;}
let dernierInstantane=instantane();
function horodater(){
  const n=instantane(),t=S._t||(S._t={}),now=Date.now();
  [...CHAMPS_PARTAGES,'custom'].forEach(c=>{const a=dernierInstantane[c]||{},b=n[c]||{};
    new Set([...Object.keys(a),...Object.keys(b)]).forEach(k=>{if(JSON.stringify(a[k])!==JSON.stringify(b[k]))t[c+':'+k]=now;});});
  dernierInstantane=n;
}
function fusionner(distant){
  if(!distant||!distant.t)return false;
  const loc=instantane(),t=S._t||(S._t={});let change=false;
  for(const [k,td] of Object.entries(distant.t)){
    if((t[k]||0)>=td)continue;
    const i=k.indexOf(':'),c=k.slice(0,i),id=k.slice(i+1),val=(distant[c]||{})[id];
    if(c==='custom'){S.custom=(S.custom||[]).filter(x=>x.id!==id);if(val)S.custom.push(val);}
    else if(CHAMPS_PARTAGES.includes(c)){S[c]=S[c]||{};if(val===undefined)delete S[c][id];else S[c][id]=val;}
    else continue;
    t[k]=td;change=true;
  }
  if(change){dernierInstantane=instantane();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
  return change;
}

// Envoi des coches. En cas d'échec, l'app le DIT (pied de l'onglet Jour) et réessaie à la synchronisation suivante.
let ENVOI_EN_ATTENTE=false;
async function envoyerEtat(){
  if(!RELAIS)return;
  ENVOI_EN_ATTENTE=true;
  for(let essai=0;essai<3;essai++){
    try{
      const l=await relais('lire',{fichier:'etat'});
      if(!l.ok)throw new Error(l.erreur||'lecture refusée');
      fusionner(l.contenu);
      const doc=instantane();doc.t=S._t||{};doc.v=1;
      const w=await relais('ecrire',{fichier:'etat',contenu:doc,version_base:l.version});
      if(w.ok){ENVOI_EN_ATTENTE=false;return;}
      if(!w.conflit)throw new Error(w.erreur||'écriture refusée');
      // conflit : un autre téléphone a écrit entre-temps, on refusionne et on réessaie
    }catch(e){ETAT_SYNC='coches non envoyées ('+(e.message||e)+'), nouvel essai bientôt';if(typeof render==='function'&&!UI.sheet)render();return;}
  }
  ETAT_SYNC='coches non envoyées, nouvel essai bientôt';if(!UI.sheet)render();
}

/* À l'ouverture et au retour dans l'app : nouvelles données et coches de l'autre téléphone */
let ETAT_SYNC=RELAIS?'en cours':'local';
async function synchroniser(){
  if(!RELAIS)return;
  try{
    const [d,e]=await Promise.all([relais('lire',{fichier:'donnees'}),relais('lire',{fichier:'etat'})]);
    if(!d.ok){
      // clé changée ou révoquée (téléphone perdu, nouvelle clé) : oublier ce lien et demander le nouveau
      if(d.erreur==='clé refusée'){localStorage.removeItem('mon-cap-relais');try{sessionStorage.setItem('mon-cap-lien-perime','1');}catch(e){}location.reload();return;}
      ETAT_SYNC='erreur : '+(d.erreur||'?');render();return;}
    let recharger=false,incompletes=false;
    if(d.contenu&&d.contenu.genere_le&&(!COLLECTE.genere_le||d.contenu.genere_le>COLLECTE.genere_le)){
      // Données nettement plus pauvres que celles déjà là (collecte ratée) : on garde les nôtres
      const n=(d.contenu.items||[]).length,a=Object.keys(d.contenu.agenda||{}).length,n0=(COLLECTE.items||[]).length,a0=Object.keys(COLLECTE.agenda||{}).length;
      if(n0&&a0&&(n<n0*0.5||a<a0*0.5)){incompletes=true;}
      else{localStorage.setItem('mon-cap-donnees',JSON.stringify(d.contenu));recharger=true;}}
    const change=e.ok&&fusionner(e.contenu);
    if(ENVOI_EN_ATTENTE)envoyerEtat();
    ETAT_SYNC=incompletes?'données reçues incomplètes, les précédentes sont gardées':'à jour à '+new Date().toLocaleTimeString('fr-CA',{hour:'2-digit',minute:'2-digit'});
    if(recharger){location.reload();return;}
    render();
  }catch(x){ETAT_SYNC='hors connexion';render();}
}

/* Importer : collecte de l'extension, données préparées ou profil. Rien ne quitte le téléphone. */
function importer(){const f=document.getElementById('fic');f.value='';f.onchange=e=>{const x=e.target.files[0];if(x)traiterImport(x);};f.click();}
function traiterImport(file){
  const r=new FileReader();
  r.onload=()=>{let o;try{o=JSON.parse(r.result);}catch(e){alert('Ce fichier n’est pas un fichier Mon Cap valide.');return;}
    try{
      if(o.type==='mon-cap-profil'){localStorage.setItem('mon-cap-profil',JSON.stringify(o));alert('Profil importé.');}
      else if(o.type==='mon-cap-donnees'||(o.agenda&&o.items)){localStorage.setItem('mon-cap-donnees',JSON.stringify(o));}
      else if(o.coba||o.classroom){localStorage.setItem('mon-cap-donnees',JSON.stringify(convertirCollecte(o,lireJSON('mon-cap-profil'))));}
      else{alert('Fichier non reconnu : il faut une collecte de l’extension, ou un profil Mon Cap.');return;}
      location.reload();
    }catch(e){alert('Import impossible : '+e.message);}
  };
  r.readAsText(file);
}
/* « il y a 3 h », « hier », « il y a 5 jours » */
function ilya(iso){
  const m=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));
  if(m<2)return 'à l’instant';if(m<60)return 'il y a '+m+' min';
  const hrs=Math.round(m/60);if(hrs<24)return 'il y a '+hrs+' h';
  const j=Math.round(hrs/24);return j===1?'hier':'il y a '+j+' jours';
}

/* Plages : 85 et plus super, 75 et plus ça va, 65 et plus bof, moins de 65 alerte */
function plage(p){return p>=85?{k:'n4',m:'Super'}:p>=75?{k:'n3',m:'Ça va'}:p>=65?{k:'n2',m:'Bof'}:{k:'n1',m:'Alerte'};}
const SMI={n4:['😄','Très bien'],n3:['🙂','Bien'],n2:['😐','Moyen'],n1:['💪','À travailler']};
const xv=p=>'--x:var(--'+plage(p).k+')';
/* Ressenti d'une matière : la note provisoire de Coba si elle existe, sinon la moyenne des 3 dernières notes */
function ressenti(code){
  const pv=(COLLECTE.provisoires||{})[code]||[],tout=GRADES.filter(x=>x.c===code).sort((a,b)=>a.d<b.d?-1:1);
  const g=tout.filter(x=>x.p!=null);   // les cotes en lettres ne comptent ni dans la courbe ni dans le smiley
  if(!pv.length&&!tout.length)return null;
  const c=pv.find(x=>x.ponderation===100)||pv[0];
  const base=c?c.note:g.length?Math.round(g.slice(-3).reduce((a,x)=>a+x.p,0)/Math.min(3,g.length)):null;
  return {p:base,pv:c||null,g,tout};
}
function spark(v,color){
  if(v.length<2)return '';
  const h=34,min=Math.min.apply(null,v)-5,max=Math.max.apply(null,v)+5;
  const pts=v.map((x,k)=>(k/(v.length-1)*92+4).toFixed(1)+','+(h-4-(x-min)/(max-min)*(h-8)).toFixed(1));
  const l=pts[pts.length-1].split(',');
  // la ligne s'étire avec la carte ; le point final est un rond HTML posé dessus, donc jamais déformé
  return '<div class="spk"><svg viewBox="0 0 100 '+h+'" preserveAspectRatio="none" aria-hidden="true"><polyline class="ln" points="'+pts.join(' ')+'" fill="none" stroke="'+color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg><span class="pt" style="left:'+l[0]+'%;top:'+(l[1]/h*100).toFixed(1)+'%;background:'+color+'"></span></div>';
}

/* Affiche une fiche. Si une fiche est déjà ouverte, seul son CONTENU est remplacé : le cadre et le fond
   restent en place, donc aucune animation ne se rejoue (pas de clignotement après une coche). */
function afficherFiche(html){
  const r=$('#sheet-root'),old=r.querySelector?r.querySelector('.sheet'):null;
  if(old&&!old.closest('.closing')){
    const t=document.createElement('div');t.innerHTML=html;const n=t.querySelector('.sheet');
    if(n){
      const top=old.scrollTop,a=document.activeElement;
      // retrouver l'élément touché après la mise à jour, pour garder le focus (clavier, lecteur d'écran)
      const cle=a&&old.contains(a)?['data-act','data-id','data-i','data-v'].map(k=>a.getAttribute(k)||'').join('|'):null;
      old.innerHTML=n.innerHTML;[...n.attributes].forEach(x=>{if(x.name!=='class')old.setAttribute(x.name,x.value);});
      old.scrollTop=top;
      if(cle){const b=[...old.querySelectorAll('[data-act]')].find(e=>['data-act','data-id','data-i','data-v'].map(k=>e.getAttribute(k)||'').join('|')===cle);if(b)b.focus({preventScroll:true});}
      return false;
    }
  }
  r.innerHTML=html;return true;   // nouvelle ouverture
}

function countUp(){
  if(typeof document.querySelectorAll!=='function'||typeof requestAnimationFrame!=='function')return;
  if(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const els=document.querySelectorAll('.go .big[data-n]'),t0=performance.now();
  els.forEach(el=>{el.textContent='0 %';});
  const step=t=>{const p=Math.min(1,Math.max(0,(t-t0-150)/800)),e=1-Math.pow(1-p,3);els.forEach(el=>{el.textContent=Math.round(e*Number(el.dataset.n))+' %';});if(p<1)requestAnimationFrame(step);};
  requestAnimationFrame(step);
}

  else if(a==='wpick')openWeekPicker();
  else if(a==='importer')importer();
  else if(a==='delier'){if(confirm('Relier cet appareil à un autre lien ? Les données, coches et ajouts affichés ici seront remplacés par ceux du nouveau lien. Rien n’est perdu : ils restent dans le Drive actuel.')){['mon-cap-relais','mon-cap-donnees','mon-cap-v2'].forEach(k=>localStorage.removeItem(k));location.reload();}}
  else if(a==='coller'){(async()=>{let t='';try{t=await navigator.clipboard.readText();}catch(e){}
    const r=lireLienRelais(t||'');if(!r){toast('Aucun code dans le presse-papiers');const d=document.querySelector('details');if(d)d.open=true;return;}
    enregistrerLien(r);try{sessionStorage.removeItem('mon-cap-lien-perime');}catch(e){}location.reload();})();}
  else if(a==='copiercode'){(async()=>{try{await navigator.clipboard.writeText(lienDeRelais(RELAIS));toast('Code copié');}catch(e){toast('Copie impossible');}})();}
  else if(a==='fermerguide'){ARRIVEE_PAR_LIEN=false;try{sessionStorage.removeItem('mon-cap-guide');}catch(e){}render();}
  else if(a==='installer'&&INVITE_INSTALL){INVITE_INSTALL.prompt();INVITE_INSTALL.userChoice.finally(()=>{INVITE_INSTALL=null;render();});}
  else if(a==='theme'){const ordre=['auto','light','dark'],cur=localStorage.getItem('mon-cap-theme')||'auto',nx=ordre[(ordre.indexOf(cur)+1)%3];
    if(nx==='auto'){localStorage.removeItem('mon-cap-theme');document.documentElement.removeAttribute('data-theme');}
    else{localStorage.setItem('mon-cap-theme',nx);document.documentElement.setAttribute('data-theme',nx);}
    const sombre=nx==='dark'||(nx==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches);
    document.querySelectorAll('meta[name=theme-color]').forEach((m,k)=>{if(nx==='auto'){m.setAttribute('media',k===0?'(prefers-color-scheme: light)':'(prefers-color-scheme: dark)');m.content=k===0?'#F3F6FF':'#0D1130';}else{m.removeAttribute('media');m.content=sombre?'#0D1130':'#F3F6FF';}});
    render();}
  else if(a==='synchro'){ETAT_SYNC='en cours';render();synchroniser().then(()=>toast('À jour'));}
  else if(a==='relier'){const r=lireLienRelais(($('#lien')||{}).value||'');if(!r){toast('Lien non reconnu');return;}enregistrerLien(r);location.reload();}
  else if(a==='dot')allerEval(v.id);
  else if(a==='suivi')openSuivi(v.v);
  else if(a==='open')openSheet(v.id);
  else if(a==='close')fermerFiche();
  else if(a==='toggle'){if(S.done[v.id])delete S.done[v.id];else{S.done[v.id]=true;UI.pop='d:'+v.id;}save();refresh();UI.pop=null;}
  else if(a==='course')openCourse(v.c);
  else if(a==='add'){if(UI.sheet==='__ajouts')UI.formDepuisAjouts=true;openForm(null,{d:(UI.tab==='jour'&&UI.day==='today'&&isSchool(TODAY))?TODAY:NEXT,ty:'devoir'});}
  else if(a==='edit'){const it=find(v.id);if(it){UI.formDepuisAjouts=!!UI.retourAjouts;openForm(it);}}
  else if(a==='mesajouts')openMesAjouts();
  else if(a==='fsave'){
    const ty=$('#f-ty').value,cc=$('#f-c').value;let tt=($('#f-t').value||'').trim();
    if(!tt){if(ty==='bring'){toast('Écris ce qu’il faut apporter');$('#f-t').focus();return;}tt=autoTitle(ty,cc);}
    const it={id:v.id||('m'+Date.now()+Math.random().toString(36).slice(2,6)),d:$('#f-d').value||NEXT,c:$('#f-c').value,t:tt,ty:ty,src:'M',time:($('#f-h').value||'').trim(),note:($('#f-n').value||'').trim()};
    if(ty==='bring')it.bring=[tt];
    if(ty==='recup'&&!it.time)it.time='dîner';
    const k=S.custom.findIndex(x=>x.id===it.id);if(k>=0)S.custom[k]=it;else S.custom.push(it);
    if(UI.sheet==='__form'&&UI.formDepuisAjouts){UI.retourAjouts=true;UI.formDepuisAjouts=false;}
    save();fermerFiche();render();
    const where={devoir:'📤 À remettre',exam:'⭐ Évaluations',projet:'⭐ Évaluations',recup:'🛟 Horaire (dîner)',bring:'🎒 Sac'}[ty];
    toast((v.id?'Modifié':'Ajouté')+' : '+where+', '+fmt(it.d));
  }
  else if(a==='del'){
    if(UI.delArm!==v.id){UI.delArm=v.id;openSheet(v.id);}
    else{S.custom=S.custom.filter(x=>x.id!==v.id);delete S.done[v.id];UI.delArm=null;save();fermerFiche();render();toast('Supprimé');}
  }
  else if(a==='chk'){const m=S[v.kind]=S[v.kind]||{};const x=m[v.d]=m[v.d]||{};x[v.k]=t.checked;if(t.checked)UI.pop='c:'+v.kind+v.d+v.k;save();refresh();UI.pop=null;}
  else if(a==='step'){const s=(S.steps[v.id]||[]).slice();s[Number(v.i)]=t.checked;S.steps[v.id]=s;if(t.checked)UI.pop='s:'+v.id+':'+v.i;save();refresh();UI.pop=null;}
});
document.addEventListener('toggle',function(e){const d=e.target;if(d&&d.dataset&&d.dataset.fold){S.open[d.dataset.fold]=d.open;if(d.open&&d.classList)d.classList.add('anim');save();}},true);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&UI.sheet)closeSheet();});
render();
synchroniser();   /* données et coches partagées, si le relais est configuré */
})();
</script>

<script>
/* Hors connexion : le service worker garde l'app en cache. La mise à jour du code se fait au prochain lancement. */
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
